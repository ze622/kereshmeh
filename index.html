<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>

  <title>کرشمه | پشتیبان هوشمند</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #fff5f9;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 25px 16px;
    }

    .header {
      text-align: center;
      padding: 20px 10px;
    }

    .logo {
      font-size: 45px;
    }

    h1 {
      color: #c2185b;
      margin: 8px 0;
    }

    .subtitle {
      color: #777;
    }

    .chat {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-top: 15px;
    }

    .message {
      background: #fff0f6;
      padding: 15px;
      border-radius: 15px;
      line-height: 1.9;
    }

    .buttons {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      background: #c2185b;
      color: white;
    }

    #status {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <div class="logo">🌸</div>

      <h1>کرشمه</h1>

      <div class="subtitle">
        پشتیبان هوشمند کرشمه
      </div>

    </div>

    <div class="chat">

      <div class="message">
        سلام 👋<br>
        به کرشمه خوش آمدید 🌸<br><br>
        من پشتیبان هوشمند کرشمه هستم.
        چطور می‌توانم کمکتان کنم؟
      </div>

      <div class="buttons">

        <button onclick="sendMessage('محصولات')">
          🛍️ مشاهده محصولات
        </button>

        <button onclick="sendMessage('قیمت')">
          💰 استعلام قیمت
        </button>

        <button onclick="sendMessage('سفارش')">
          📦 ثبت سفارش
        </button>

      </div>

    </div>

    <div id="status">
      در حال بررسی اتصال به ایتا...
    </div>

  </div>

<script>

  if (window.Eitaa && window.Eitaa.WebApp) {

    document.getElementById("status").innerText =
      "✅ برنامه کرشمه با موفقیت در ایتا اجرا شد.";

  } else {

    document.getElementById("status").innerText =
      "صفحه در حالت مرورگر باز شده است.";

  }

  function sendMessage(type) {

    if (type === "محصولات") {
      alert("بخش محصولات به‌زودی فعال می‌شود 🌸");
    }

    if (type === "قیمت") {
      alert("بخش استعلام قیمت به‌زودی فعال می‌شود 💰");
    }

    if (type === "سفارش") {
      alert("بخش ثبت سفارش به‌زودی فعال می‌شود 📦");
    }

  }

</script>

</body>
</html>
